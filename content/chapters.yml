# CHAPTERS: your writing. Order doesn't matter: chapters are
# sorted and numbered by date automatically.
#
# Medium posts load by themselves (set medium_username in
# profile.yml), so you only need to list them here if they're
# older than Medium's last ~10, or also published on this site.
#
# ── A chapter people read HERE, on this site ──
# 1. Write it as a Markdown file in content/posts/, e.g.
#    content/posts/my-first-post.md (no title line inside).
#    Pictures go in content/posts/images/.
# 2. Add a block like this. `post` is the file name without .md:
#
#   - title: "Your post title"
#     date: 2026-11-02
#     post: my-first-post
#     excerpt: "One line about the post."
#     minutes: 5              # optional, worked out for you if left out
#     url: https://medium.com/...   # optional: also on Medium? link it here
#
# ── A chapter that lives somewhere ELSE (Dev.to, an old Medium post) ──
#
#   - title: "Your post title"
#     date: 2026-11-02
#     source: Medium          # Medium, Dev.to, anything
#     url: https://...
#     minutes: 5              # optional
#     excerpt: "One line about the post."
